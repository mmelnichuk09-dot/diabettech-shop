<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freestyle Libre 2 Shop</title>
  {% load static %}
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
    }
    .header {
      color: white;
      padding: 10px;
      text-align: center;
      margin: 10px 0;
    }
    .header h1 {
      color: #2c5282;
      margin: 0;
      font-size: 1.5em;
    }
    .container {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    img {
      max-width: 100%;
      height: auto;
    }
    p {
      font-size: 1em;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin: 10px 0 5px;
      text-align: left;
    }
    input {
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    button {
      position: relative;
      padding: 10px;
      background-color: #2c5282;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    #card-element {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 10px;
      width: 100%;
      min-height: 40px;
    }
    .spinner {
      display: none;
      margin-left: 10px;
    }
    .success {
      color: green;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>DiabetTech</h1>
  </div>
  <div class="container">
    <img src="{% static 'img/freestyle-libre-2.jpg' %}" alt="Freestyle Libre 2">
    <h1>Freestyle Libre 2</h1>
    <p>Price: €69 | Free Delivery (4-7 days)</p>
    <form id="payment-form" method="post" action="{% url 'create_payment_intent' %}">
      {% csrf_token %}
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" name="quantity" min="1" value="1" required>

      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" required>

      <label for="postalCode">Postal Code:</label>
      <input type="text" id="postalCode" name="postalCode" required>

      <label for="address">Delivery Address:</label>
      <input type="text" id="address" name="address" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <div id="card-element"></div>
      <div id="card-errors" class="error" role="alert"></div>

      <button type="submit" id="buy-button">
        <span class="btn-text">Buy Now (€69)</span>
        <span class="spinner">⏳</span>
      </button>
    </form>
    <p>Contact: +353899810935 (WhatsApp)</p>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var stripe = Stripe('{{ stripe_public_key }}');
      var elements = stripe.elements();
      var card = elements.create('card', {
        style: { base: { fontSize: '16px', color: '#333' } },
        hidePostalCode: true
      });
      card.mount('#card-element');

      const form = document.getElementById('payment-form');
      const buyButton = document.getElementById('buy-button');
      const btnText = buyButton.querySelector('.btn-text');
      const spinner = buyButton.querySelector('.spinner');
      let isProcessing = false;

      form.addEventListener('submit', function(event) {
        event.preventDefault();
        if (isProcessing) return;
        isProcessing = true;

        buyButton.disabled = true;
        btnText.textContent = 'Processing...';
        spinner.style.display = 'inline-block';

        stripe.createToken(card).then(function(result) {
          if (result.error) {
            document.getElementById('card-errors').textContent = result.error.message;
            isProcessing = false;
            buyButton.disabled = false;
            btnText.textContent = 'Buy Now (€69)';
            spinner.style.display = 'none';
          } else {
            fetch("{% url 'create_payment_intent' %}", {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
              },
              body: JSON.stringify({
                token: result.token.id,
                fullName: document.getElementById('fullName').value,
                postalCode: document.getElementById('postalCode').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                quantity: document.getElementById('quantity').value
              })
            }).then(response => response.json())
              .then(data => {
                if (data.success) {
                  window.location.href = "{% url 'order_success' %}";
                } else {
                  document.getElementById('card-errors').textContent = data.error;
                  isProcessing = false;
                  buyButton.disabled = false;
                  btnText.textContent = 'Buy Now (€69)';
                  spinner.style.display = 'none';
                }
              }).catch(error => {
                document.getElementById('card-errors').textContent = 'Payment error: ' + error.message;
                isProcessing = false;
                buyButton.disabled = false;
                btnText.textContent = 'Buy Now (€69)';
                spinner.style.display = 'none';
              });
          }
        });
      });

      // Обновление текста кнопки при изменении количества
      const pricePerItem = 69;
      const quantityInput = document.getElementById('quantity');
      function updateButtonText() {
        const qty = parseInt(quantityInput.value) || 1;
        btnText.textContent = `Buy Now (€${qty * pricePerItem})`;
      }
      quantityInput.addEventListener('input', updateButtonText);
      updateButtonText();
    });
  </script>
</body>
</html>
